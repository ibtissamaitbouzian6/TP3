[project]
name = "tp3-asd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ibtissam", email = "your-email@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
tp3-asd = "tp3_asd:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
